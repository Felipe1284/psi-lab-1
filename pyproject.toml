[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-lab"
version = "0.1.0"
description = "Laboratorio 1 de Procesamiento de Señales e Imágenes (13318), USACH"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Felipe Bobadilla", email = "felipe.bobadilla@usach.cl" },
    { name = "Camila Garate", email = "camila.garate@usach.cl" },
    { name = "Gabriela Mathias", email = "gabriela.mathias@usach.cl" },
    { name = "Matias Urbano", email = "matias.urbano@usach.cl" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "wfdb>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
psi-ecg = "psi_lab.lab1.caso_ecg:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::Warning:wfdb.*",
]